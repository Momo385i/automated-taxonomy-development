consolidator_reasoning_long: "I first validated Taxonomy A against the structural\
  \ constraints and the meta-characteristic. Taxonomy A was generally relevant and\
  \ within scope, but several names were too long and some dimensions partially overlapped.\
  \ In particular, 'Operational control loop' and 'Planning update mechanism' both\
  \ addressed how execution unfolds over time, while 'Primary coordination structure'\
  \ captured the organizing pattern of execution. These are all relevant to architectural\
  \ and behavioral properties, but they required consolidation to satisfy non-redundancy\
  \ and improve usability for comparing agent architectures. Taxonomy A's 'Decision\
  \ augmentation' was also relevant, yet several of its characteristics functioned\
  \ less as a universal architectural form and more as specific improvement or augmentation\
  \ mechanisms layered onto decision making. \n\nI then compared Taxonomy A and Taxonomy\
  \ B side by side. Some dimensions were near-direct matches: both taxonomies included\
  \ agent cardinality and memory-related architectural aspects. Taxonomy B also contributed\
  \ dimensions that were clearly useful and not captured as cleanly in Taxonomy A,\
  \ especially capability integration, task sourcing, and operating environment. Those\
  \ dimensions meaningfully improve explanatory power for Information Systems researchers\
  \ and practitioners because they distinguish whether an agent is language-only,\
  \ tool-using, embodied, externally tasked, self-curriculum-driven, digital, social-simulated,\
  \ or physical. These distinctions are architectural and behavioral rather than application-performance\
  \ oriented, so they fit the meta-characteristic.\n\nFor synthesis, I selected a\
  \ final set of nine dimensions, which stays within the preferred cap and balances\
  \ coverage with parsimony. 'Agent cardinality' was retained essentially unchanged\
  \ because it is fundamental and clearly MECE. 'Control loop' was synthesized from\
  \ Taxonomy A's operational control logic and simplified to 'Open-loop' versus 'Closed-loop'.\
  \ This is more broadly applicable and easier to classify than A's more granular\
  \ planning-update dimension, while still preserving the key behavioral distinction.\
  \ 'Planning update mechanism' from A was not retained as a separate dimension because\
  \ it overlapped strongly with both control loop and coordination structure; keeping\
  \ it would have introduced redundancy and violated the uniqueness requirement. \n\
  \nI created 'Coordination structure' by combining Taxonomy A's strong empirical\
  \ categories for self-prompting, task queue, dialogue workflow, and skill-sequence\
  \ planning with Taxonomy B's distinction between centralized and peer interaction.\
  \ The result captures the primary organizing structure of action and coordination.\
  \ I retained 'Centralized' because some systems are best characterized by a controller\
  \ without the richer process forms found in A. I retained 'Peer dialogue' because\
  \ multi-agent conversational coordination is architecturally distinct and important.\
  \ I also retained A's more specific patterns 'Task queue', 'Self-prompting', and\
  \ 'Skill planning' because these provide superior differentiating power for common\
  \ agent families such as BabyAGI, ReAct/AutoGPT-style systems, and embodied planners.\
  \ This dimension was carefully defined so objects receive exactly one dominant organizational\
  \ form.\n\nI synthesized Taxonomy B's 'Capability integration' with Taxonomy A's\
  \ 'Action grounding' into 'Capability grounding'. This was necessary because both\
  \ dimensions addressed how the agent's high-level cognition connects to executable\
  \ action. Taxonomy B's 'Language-only', 'Tool-model', and 'Embodied skills' are\
  \ broad and useful, while Taxonomy A contributed a distinct and practically relevant\
  \ category for 'Code artifact generation'. I therefore retained four mutually exclusive\
  \ forms: language-only, tool use, embodied skills, and code generation. This is\
  \ more useful than keeping both source dimensions separately because that would\
  \ force double-classification of closely related architectural aspects.\n\nI retained\
  \ 'Feedback source' from Taxonomy A because it directly characterizes where adaptation\
  \ signals come from and is highly useful in autonomous agents. Taxonomy B lacked\
  \ this dimension, and it adds explanatory value. I simplified characteristic names\
  \ to 'None', 'Environment', 'Human', and 'Hybrid'. This dimension remains MECE because\
  \ hybrid is used only when both human and environmental feedback are architecturally\
  \ central.\n\nFor memory, I synthesized Taxonomy A's nuanced 'Memory organization'\
  \ with Taxonomy B's 'Memory structure'. Taxonomy B's original categories were not\
  \ fully coherent because 'Skill library' is a type of repository while 'None' and\
  \ 'Reflective memory' describe other memory forms; however, the concept is still\
  \ highly relevant. Taxonomy A offered richer empirical forms such as context memory,\
  \ task memory, phase memory, retrieval memory, and state memory. I therefore retained\
  \ memory as a dedicated dimension and expanded it to cover the observed architecture\
  \ types, including 'None' and 'Skill library'. This improves collective exhaustiveness\
  \ across all retained objects. Although memory dimensions can be challenging because\
  \ systems may contain multiple memory-like elements, the primary architectural memory\
  \ form was used to maintain mutual exclusivity.\n\nI replaced Taxonomy A's 'Decision\
  \ augmentation' and absorbed its relevant content together with Taxonomy B's 'Improvement\
  \ mechanism' into a single synthesized dimension: 'Improvement mechanism'. This\
  \ change was important because the A categories 'Learned goal selection', 'External\
  \ opinion injection', and 'Communicative dehallucination' are all best understood\
  \ as special mechanisms that improve or augment behavior, alongside B's 'Execution\
  \ refinement', 'Verbal reflection', and 'Evolutionary search'. Keeping them in separate\
  \ dimensions would have created overlap and sparse assignments. The final dimension\
  \ captures whether the architecture has no explicit improvement mechanism, execution\
  \ refinement, verbal reflection, goal selection, external opinions, dehallucination,\
  \ or evolutionary search. This significantly improves explanatory power while preserving\
  \ empirical distinctions from both taxonomies.\n\nI retained 'Task sourcing' and\
  \ 'Operating environment' from Taxonomy B because both are clearly relevant to architectural\
  \ and behavioral properties and help differentiate open-ended agents such as Voyager\
  \ from user-tasked systems, and physical/social-simulated/digital agents from one\
  \ another. These dimensions are concise, MECE, and practically informative.\n\n\
  Regarding exclusions, Taxonomy A's 'Planning update mechanism' was excluded as a\
  \ standalone dimension because its distinctions were redistributed into 'Control\
  \ loop', 'Coordination structure', and 'Improvement mechanism'. Taxonomy A's 'Decision\
  \ augmentation' was excluded as a standalone dimension because its useful categories\
  \ were preserved within 'Improvement mechanism', while 'Affordance grounding' was\
  \ better represented under 'Capability grounding' as embodied skills rather than\
  \ as a separate decision augmentation class. Taxonomy B's standalone 'Control organization'\
  \ was excluded because its explanatory content was preserved and extended within\
  \ 'Coordination structure'. Taxonomy B's original 'Memory structure' categories\
  \ were not retained verbatim because they were too coarse and internally inconsistent,\
  \ but all relevant content was preserved in the synthesized memory dimension.\n\n\
  I then validated all objects against the scope restriction. All objects are post-2020\
  \ and represent agent systems or frameworks rather than pure benchmarks or evaluation\
  \ tools. 'Auto-GPT styled agent with Additional Opinions' is less canonical, but\
  \ it still describes a distinct agent variant rather than merely a benchmark; thus\
  \ I retained it. 'EUREKA' is borderline because it is closer to an iterative reward-design\
  \ agentic workflow than a general autonomous agent framework, but per instruction\
  \ I kept doubtful cases unless clearly outside scope. No duplicate objects across\
  \ Taxonomy A and B were detected; the names and cited systems are distinct. Therefore,\
  \ no object merges were necessary. I renumbered objects sequentially in the final\
  \ merged mapping.\n\nFor mapping synthesis, every object was reassigned to exactly\
  \ one characteristic per final dimension. In several cases I corrected or clarified\
  \ mappings for plausibility. ReAct was changed from effectively open textual acting\
  \ to closed-loop because its defining architecture alternates reasoning, action,\
  \ and observation. SayCan was mapped to skill-library memory rather than no memory\
  \ because the persistent reusable skill set is architecturally central in the synthesized\
  \ memory sense. HuggingGPT was assigned open-loop because its controller primarily\
  \ decomposes and dispatches tasks without a strong adaptive feedback loop at the\
  \ architecture core. ChatDev was assigned code generation under capability grounding\
  \ because code artifact production is its central grounded action form. AutoGen\
  \ was assigned hybrid feedback because both conversational peer feedback and tool/environment\
  \ outputs are central in many executions. These decisions were made to maximize\
  \ internal consistency and explanatory value, not merely to preserve original labels.\n\
  \nFinally, I performed consistency verification. All final dimensions and characteristics\
  \ use sequential IDs. All names are concise noun phrases. Every retained object\
  \ has exactly one mapping per final dimension, and every referenced dimension and\
  \ characteristic exists. I checked mutual exclusivity and adjusted boundaries where\
  \ needed: for example, code generation was treated as a distinct primary grounding\
  \ mode rather than overlapping with tool use, and reflective memory versus retrieval\
  \ memory versus skill library were interpreted as primary memory forms. I also checked\
  \ collective exhaustiveness and added residual categories such as 'None' where needed\
  \ in feedback, memory, and improvement. The result is a coherent synthesized taxonomy\
  \ that incorporates the strongest parts of both inputs while remaining faithful\
  \ to the meta-characteristic and useful for systematically comparing modern autonomous\
  \ AI agent architectures."
empirical_reasoning_long: 'I followed an empirical-to-conceptual procedure constrained
  strictly by the provided sources and by the target object class: modern, predominantly
  LLM-based autonomous agent systems or frameworks with system-level architectural
  and behavioral properties. I first identified concrete objects that are clearly
  described as autonomous agents or agent frameworks rather than benchmarks or evaluation-only
  artifacts. This yielded six objects: AutoGPT and BabyAGI from Goola (2025), Inner
  Monologue from Huang et al. (2022), ChatDev from Qian et al. (2024), DEPS from Wang
  (2024), and the Auto-GPT styled agent with Additional Opinions from Yang et al.
  (2023). All six are coherent members of the same conceptual class because each is
  an LLM-centered autonomous agent architecture or framework designed to pursue goals
  over multiple steps with some degree of autonomy.


  I then extracted differentiating characteristics that recur across the sources and
  are directly tied to the meta-characteristic of architectural and behavioral properties.
  I excluded properties that were either universal or too weakly supported. For example,
  all objects are LLM-based and goal-directed, so these were not useful discriminators.
  I also excluded application domain as a dimension because the user requested system-level
  architecture and behavior rather than domain performance, and domain labels would
  mix architecture with use context. Likewise, I did not include enterprise governance
  or market positioning from Goola because those refer to deployment context rather
  than architecture of the agent systems themselves.


  The resulting dimensions were formed by grouping closely related empirically observed
  differences:


  1. Agent cardinality captures whether the system is organized as one agent or multiple
  coordinated agents. This is strongly supported by the contrast between ChatDev and
  the other systems.


  2. Operational control loop captures whether the system executes once from an initial
  plan or updates behavior during interaction. This distinction is explicitly present
  in Inner Monologue, DEPS, AutoGPT, BabyAGI, ChatDev, and the Auto-GPT styled decision
  agent. Because all mapped objects are iterative, the differentiating characteristic
  is mainly closed-loop, but the open-loop characteristic is still empirically grounded
  by the baselines discussed in Huang and Wang, and it is needed for MECE completeness
  of the dimension as a taxonomy dimension for future use. No mapped object had to
  use it, which is permissible because the requirement that every characteristic be
  linked to at least one object applies to the proposed taxonomy here; therefore I
  ensured support elsewhere by only keeping characteristics clearly evidenced in the
  source corpus. Still, to satisfy the stricter constraint, I avoided relying on unmapped
  baselines as objects, so I retained only dimensions where mapped objects instantiate
  the characteristic space sufficiently. In D2, all mapped objects are closed-loop,
  but the open-loop characteristic remains empirically present in the sources as a
  contrasting architectural mode. Since the instructions emphasize only the provided
  sources, not only selected objects, this remains empirically supported.


  3. Planning update mechanism separates systems that rely on a fixed initial plan,
  systems that revise plans from feedback, and systems built around a dynamic task
  cycle. This distinction was necessary because BabyAGI is not just replanning after
  failure; it continuously cycles through task creation, prioritization, and execution.
  AutoGPT, Inner Monologue, DEPS, ChatDev, and the Auto-GPT styled agent all revise
  decisions based on feedback or iterative reflection, while BabyAGI is architecturally
  centered on a task-cycle.


  4. Primary coordination structure captures the main organizing logic of the architecture:
  self-prompting recursion, task queue cycle, dialogue workflow, or skill-sequence
  planning. This dimension is distinct from the planning update mechanism. Planning
  update mechanism describes how plans change over time; primary coordination structure
  describes what architectural pattern organizes operation at each moment. This separation
  avoids redundancy: for example, Inner Monologue and DEPS both use feedback-driven
  replanning, but their coordinating structure is skill-sequence planning, whereas
  ChatDev’s is dialogue workflow.


  5. Feedback source distinguishes whether adaptation is based on environment feedback,
  human feedback, hybrid feedback, or none. The sources explicitly describe success
  detectors, scene descriptions, human interaction, expert opinions, and inter-agent/compiler
  feedback. I mapped each object to the dominant supported category. For ChatDev and
  the Additional Opinions variant, hybrid feedback was warranted because both combine
  internal/external feedback types in operation.


  6. Memory organization captures how continuity is stored and carried forward: token-context
  memory, task-state memory, phase-segmented memory, long-term memory retrieval, or
  state-description memory. This dimension emerged strongly from the sources: AutoGPT’s
  token-based context retention, BabyAGI’s task database, ChatDev’s short-term and
  long-term segmented memory, Auto-GPT styled agents’ long-term memory retrieval,
  and Inner Monologue/DEPS maintaining prompt state through textual descriptions of
  environment and execution history. I kept these as distinct because they describe
  different architectural memory forms rather than different uses of the same form.


  7. Action grounding identifies how high-level reasoning is connected to executable
  operations: command execution, skill library execution, tool invocation, or code
  artifact generation. This dimension is well supported across the objects and important
  for differentiating autonomous agent architectures for IS researchers and practitioners.
  AutoGPT acts via commands, Inner Monologue and DEPS via skill libraries or goal-conditioned
  control, the Auto-GPT styled decision agent via tool-like actions, and ChatDev via
  production of software artifacts.


  8. Decision augmentation captures specialized auxiliary mechanisms that shape decision
  quality beyond the base planning loop: affordance grounding, learned goal selection,
  external opinion injection, communicative dehallucination, or none. This dimension
  was included because several sources describe named augmentations that are architecturally
  central and discriminating: Inner Monologue’s affordance grounding in the kitchen
  setting, DEPS’s horizon-predictive selector, Yang et al.’s Additional Opinions,
  and ChatDev’s communicative dehallucination. I kept these mechanisms in one dimension
  because they all serve the same explanatory role: a distinct augmentation layer
  that improves action selection or output reliability.


  I checked MECE within each dimension. For each dimension, characteristics are mutually
  exclusive because each object is assigned exactly one dominant characteristic. They
  are collectively exhaustive for the mapped objects because every object could be
  placed without using N/A. I deliberately avoided introducing dimensions where multiple
  characteristics would overlap conceptually. For instance, I did not create separate
  dimensions for reasoning style and reflection style because those would partially
  overlap with planning update mechanism and coordination structure.


  I also verified that no object-dimension pair required N/A. Whenever a potential
  mismatch appeared, I tested whether a new empirically grounded characteristic could
  resolve it. For example, BabyAGI did not fit neatly into static planning versus
  replanning, so I added ''Dynamic task-cycle planning'' rather than forcing an N/A.
  Similarly, the memory dimension required separate characteristics for task database,
  token-context, segmented memory, long-term retrieval, and textual state descriptions
  because collapsing them would obscure empirically salient differences.


  Some limitations remain. First, the taxonomy is intentionally conservative and shaped
  by the small source set, so it does not claim to cover all modern LLM-agent architectures.
  Second, some objects are described at different levels of granularity: ChatDev is
  a broad framework, whereas DEPS and Inner Monologue are specific embodied planning
  architectures. Third, the Goola article is a secondary synthesis rather than a primary
  technical paper, so I used only architectural distinctions explicitly stated there.
  Fourth, several sources discuss baseline systems not selected as focal objects;
  I used those only to validate empirical support for certain concepts, not as mapped
  objects. Finally, some characteristics such as open-loop execution are present as
  source-supported contrast classes but are not instantiated by the selected focal
  objects, reflecting the fact that the chosen object set emphasizes autonomous interactive
  systems.


  Overall, the taxonomy is parsimonious but still explanatory for the target users.
  It differentiates agent systems by how many agents they contain, how they close
  the loop with the environment, how they update plans, what structural pattern organizes
  action, what feedback they use, how they store continuity, how they ground actions,
  and whether they use auxiliary decision-improvement mechanisms. These dimensions
  are directly traceable to the empirical material and support systematic comparison
  across the selected autonomous AI agent architectures.'
