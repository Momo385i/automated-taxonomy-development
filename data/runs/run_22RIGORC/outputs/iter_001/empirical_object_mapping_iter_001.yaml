iteration: 1
objects:
- id: O1
  name: EUREKA
  source_document: ma et al 2023 - Eureka- Human-Level Reward Design via Coding Large
    Language Models.pdf
  dimension_mappings:
  - dimension_id: D1
    characteristic_id: D1.C1
    reasoning: EUREKA is described as one reward-design agent built around a coding
      LLM rather than multiple interacting agents.
  - dimension_id: D2
    characteristic_id: D2.C3
    reasoning: Its core output is executable reward function code generated from environment
      code and task description.
  - dimension_id: D3
    characteristic_id: D3.C4
    reasoning: The method iteratively samples and refines reward candidates through
      evolutionary search with reflection-informed mutation.
  - dimension_id: D4
    characteristic_id: D4.C1
    reasoning: The paper describes iterative prompt updating and best-candidate reuse,
      but not a persistent memory store or reusable library analogous to reflective
      memory or a skill library.
  - dimension_id: D5
    characteristic_id: D5.C1
    reasoning: EUREKA receives a given task description and environment rather than
      autonomously generating its own curriculum of tasks.
- id: O2
  name: Reflexion
  source_document: shinn et al 2023 - Reflexion- Language Agents with Verbal Reinforcement
    Learning.pdf
  dimension_mappings:
  - dimension_id: D1
    characteristic_id: D1.C1
    reasoning: Reflexion is presented as a language agent architecture with modular
      components, but the acting system itself is one agent learning over trials.
  - dimension_id: D2
    characteristic_id: D2.C1
    reasoning: The actor generates text and task-specific actions in environments
      such as ALFWorld, QA, and programming loops rather than coordinating by agent-to-agent
      chat.
  - dimension_id: D3
    characteristic_id: D3.C2
    reasoning: Its defining mechanism is verbal self-reflection from feedback, stored
      and reused to improve later trials.
  - dimension_id: D4
    characteristic_id: D4.C2
    reasoning: The framework explicitly maintains an episodic memory buffer of reflective
      text summaries across trials.
  - dimension_id: D5
    characteristic_id: D5.C1
    reasoning: Tasks are benchmark-provided and externally specified, not autonomously
      generated by the system.
- id: O3
  name: VOYAGER
  source_document: wang et al 2023 - Voyager-An Open-Ended Embodied Agent with Large
    Language Models.pdf
  dimension_mappings:
  - dimension_id: D1
    characteristic_id: D1.C1
    reasoning: VOYAGER is introduced as one embodied lifelong learning agent, despite
      using self-verification as an internal module.
  - dimension_id: D2
    characteristic_id: D2.C2
    reasoning: The agent uses executable code as the action space for embodied control
      in Minecraft.
  - dimension_id: D3
    characteristic_id: D3.C3
    reasoning: It improves programs through iterative prompting using environment
      feedback, execution errors, and self-verification.
  - dimension_id: D4
    characteristic_id: D4.C3
    reasoning: A central architectural component is an ever-growing skill library
      of executable code indexed and retrieved for reuse.
  - dimension_id: D5
    characteristic_id: D5.C2
    reasoning: VOYAGER uses an automatic curriculum that proposes new tasks based
      on exploration progress and current state.
- id: O4
  name: AutoGen
  source_document: wu et al 2023- AutoGen-Enabling Next-Gen LLM Applications via Multi-Agent
    Conversation.pdf
  dimension_mappings:
  - dimension_id: D1
    characteristic_id: D1.C2
    reasoning: AutoGen is explicitly a framework for applications built from multiple
      conversable agents.
  - dimension_id: D2
    characteristic_id: D2.C4
    reasoning: Its primary interaction substrate is message-based multi-agent conversation,
      even when some agents can execute code or call tools.
  - dimension_id: D3
    characteristic_id: D3.C1
    reasoning: The framework centers on conversation orchestration and auto-reply
      patterns, not a built-in iterative self-improvement mechanism like reflection,
      search, or execution-grounded refinement at the framework level.
  - dimension_id: D4
    characteristic_id: D4.C1
    reasoning: The paper does not define a persistent reflective memory or reusable
      skill library as a core framework component.
  - dimension_id: D5
    characteristic_id: D5.C1
    reasoning: Applications are initiated with developer- or user-specified tasks
      rather than a self-generated curriculum.
- id: O5
  name: ReAct
  source_document: yao et al 2023 - ReAct- Synergizing Reasoning and Acting in Language
    Models.pdf
  dimension_mappings:
  - dimension_id: D1
    characteristic_id: D1.C1
    reasoning: ReAct is a single language-model-based agent that interleaves reasoning
      and acting.
  - dimension_id: D2
    characteristic_id: D2.C1
    reasoning: It produces textual reasoning traces and task-specific text actions
      such as search, lookup, finish, or environment actions.
  - dimension_id: D3
    characteristic_id: D3.C1
    reasoning: ReAct interleaves reasoning and acting within a trajectory but does
      not include an explicit cross-trial improvement loop as a core architectural
      mechanism.
  - dimension_id: D4
    characteristic_id: D4.C1
    reasoning: The architecture does not maintain a persistent memory store or reusable
      skill repository across tasks or trials.
  - dimension_id: D5
    characteristic_id: D5.C1
    reasoning: ReAct operates on tasks supplied by the benchmark or user prompt rather
      than generating new tasks for itself.
