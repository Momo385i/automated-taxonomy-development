      and behavior: who acts, what grounds action, how control is coordinated, how
      capabilities are integrated, how plans are formed, whether memory persists,
      where tasks come from, how stopping is judged, and in what environment the agent
      is embedded. These distinctions are meaningful for comparing system designs
      beyond application performance.'
  - id: SEC_06
