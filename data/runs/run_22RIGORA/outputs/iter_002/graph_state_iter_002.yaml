  - id: OEC_08
    name: Unique characteristics
    met: true
    evidence: Within each dimension, characteristic labels are distinct. For example,
      D2 contains six different grounding types and D4 contains None, Skill library,
      Tool library, and Model hub without repeated labels inside the same dimension.
  - id: OEC_09
    name: Unique cells
