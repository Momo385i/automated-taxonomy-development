iteration: 1
objects:
- id: O1
  name: ReAct
  source_document: yao et al 2023 - ReAct- Synergizing Reasoning and Acting in Language
    Models.pdf
  dimension_mappings:
  - dimension_id: D1
    characteristic_id: D1.C1
    reasoning: ReAct is described as a single language model agent that interleaves
      thoughts and actions.
  - dimension_id: D2
    characteristic_id: D2.C1
    reasoning: Its action space consists of textual reasoning traces and task-specific
      text actions such as search, lookup, finish, or environment commands.
  - dimension_id: D3
    characteristic_id: D3.C1
    reasoning: The system generates trajectories in one pass and does not maintain
      an explicit across-trial self-improvement loop.
  - dimension_id: D4
    characteristic_id: D4.C1
    reasoning: The paper discusses working memory through the current trajectory context
      but not a persistent memory store across trials.
  - dimension_id: D5
    characteristic_id: D5.C1
    reasoning: Tasks come from benchmark prompts or environment goals rather than
      being generated by the agent itself.
  - dimension_id: D6
    characteristic_id: D6.C1
    reasoning: Completion is determined by the environment or benchmark action such
      as finish[answer], not by a separate verifier agent.
- id: O2
  name: Reflexion
  source_document: shinn et al 2023 - Reflexion- Language Agents with Verbal Reinforcement
    Learning.pdf
  dimension_mappings:
  - dimension_id: D1
    characteristic_id: D1.C1
    reasoning: Reflexion is formulated around one agent policy augmented with evaluator
      and self-reflection components, not a cooperating multi-agent system.
  - dimension_id: D2
    characteristic_id: D2.C1
    reasoning: The actor produces text and environment actions, while reflections
      are verbal summaries rather than executable programs.
  - dimension_id: D3
    characteristic_id: D3.C2
    reasoning: Its core learning loop is verbal self-reflection from feedback stored
      for later trials.
  - dimension_id: D4
    characteristic_id: D4.C2
    reasoning: The framework explicitly stores self-reflections in an episodic memory
      buffer for future trials.
  - dimension_id: D5
    characteristic_id: D5.C1
    reasoning: The agent solves externally given tasks from benchmarks such as AlfWorld,
      HotPotQA, and programming datasets.
  - dimension_id: D6
    characteristic_id: D6.C1
    reasoning: Task success is judged by environment signals, heuristics, exact match,
      or test execution rather than a dedicated verifier agent deciding completion.
- id: O3
  name: VOYAGER
  source_document: wang et al 2023 - Voyager-An Open-Ended Embodied Agent with Large
    Language Models.pdf
  dimension_mappings:
  - dimension_id: D1
    characteristic_id: D1.C1
    reasoning: VOYAGER is presented as one embodied agent with internal modules, not
      as multiple conversational agents.
  - dimension_id: D2
    characteristic_id: D2.C2
    reasoning: It explicitly uses code as the action space and stores executable programs
      as skills.
  - dimension_id: D3
    characteristic_id: D3.C2
    reasoning: Programs are iteratively refined using environment feedback, execution
      errors, and critique.
  - dimension_id: D4
    characteristic_id: D4.C3
    reasoning: A central architectural element is an ever-growing skill library of
      executable code retrieved for reuse.
  - dimension_id: D5
    characteristic_id: D5.C2
    reasoning: VOYAGER contains an automatic curriculum that proposes progressively
      harder self-driven tasks.
  - dimension_id: D6
    characteristic_id: D6.C2
    reasoning: A separate self-verification module based on GPT-4 checks whether the
      task has been completed.
- id: O4
  name: AutoGen
  source_document: wu et al 2023- AutoGen-Enabling Next-Gen LLM Applications via Multi-Agent
    Conversation.pdf
  dimension_mappings:
  - dimension_id: D1
    characteristic_id: D1.C2
    reasoning: AutoGen is explicitly a framework for multiple conversable agents that
      cooperate through conversation.
  - dimension_id: D2
    characteristic_id: D2.C1
    reasoning: Its primary interaction medium is conversational message passing, even
      when messages may contain code for execution.
  - dimension_id: D3
    characteristic_id: D3.C2
    reasoning: Agents improve outputs through conversational feedback, error correction,
      and iterative exchange across turns.
  - dimension_id: D4
    characteristic_id: D4.C1
    reasoning: The framework maintains conversation context, but the provided source
      does not define a persistent reflective memory buffer or skill library as a
      core architecture.
  - dimension_id: D5
    characteristic_id: D5.C1
    reasoning: Applications are initiated from user or benchmark tasks rather than
      a self-generated curriculum.
  - dimension_id: D6
    characteristic_id: D6.C1
    reasoning: Termination is controlled by conversation rules or conditions such
      as receiving TERMINATE, not by a dedicated verifier agent module.
- id: O5
  name: EUREKA
  source_document: ma et al 2023 - Eureka- Human-Level Reward Design via Coding Large
    Language Models.pdf
  dimension_mappings:
  - dimension_id: D1
    characteristic_id: D1.C1
    reasoning: EUREKA is described as a single reward-design agent centered on one
      coding LLM loop.
  - dimension_id: D2
    characteristic_id: D2.C2
    reasoning: Its outputs are executable reward function code sampled and refined
      by the coding LLM.
  - dimension_id: D3
    characteristic_id: D3.C3
    reasoning: The main optimization mechanism is evolutionary search over reward
      code candidates.
  - dimension_id: D4
    characteristic_id: D4.C1
    reasoning: The architecture reuses prompts and best candidates but does not define
      a persistent reflective memory buffer or reusable skill library.
  - dimension_id: D5
    characteristic_id: D5.C1
    reasoning: Tasks are supplied as environment code and task descriptions, not generated
      by the system.
  - dimension_id: D6
    characteristic_id: D6.C1
    reasoning: Reward quality is determined by fitness evaluation from RL training
      statistics rather than a distinct verifier agent judging completion.
