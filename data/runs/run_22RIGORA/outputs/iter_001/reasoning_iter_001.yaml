empirical_reasoning: 'I followed an empirical-to-conceptual procedure grounded strictly
  in the five provided source documents and limited the taxonomy to aspects that clearly
  differentiate the same object class: modern LLM-based autonomous agent systems or
  frameworks with goal-directed behavior. I first identified concrete objects at the
  system/framework level from the sources: ReAct, Reflexion, VOYAGER, AutoGen, and
  EUREKA. All five are architectural artifacts rather than datasets or evaluation-only
  tools, and each is described as an autonomous or semi-autonomous agentic system/framework.
  Although AutoGen is a framework and EUREKA is a reward-design agent rather than
  an embodied assistant, both still fit the requested object class because the user
  explicitly included systems and frameworks with autonomous, goal-directed behavior
  and asked for system-level architecture and behavior.


  I then extracted candidate differentiating properties directly from the sources.
  I excluded properties that did not vary meaningfully across the objects or were
  too source-specific. For example, all systems are LLM-based and post-2020, so those
  are inclusion criteria rather than discriminating dimensions. I also did not create
  dimensions for application domain, benchmark performance, or specific base model
  names because the task asks for architectural and behavioral classification rather
  than domain evaluation.


  The retained dimensions emerged where the sources repeatedly described clear architectural
  choices with observable variation across objects.


  D1 Agent organization captures whether the architecture is built as one agentic
  unit or as multiple interacting agents. This distinction is explicit in AutoGen,
  which centers on multiple conversable agents, while ReAct, Reflexion, VOYAGER, EUREKA
  are each presented as a single agent/system with internal modules. I kept this dimension
  binary because the sources only support these two forms for the chosen objects.


  D2 Action representation captures the form in which the agent issues operative outputs
  to affect its task process. Two empirically supported forms appeared. ReAct, Reflexion,
  and AutoGen primarily operate through textual action traces or conversational messages.
  VOYAGER and EUREKA explicitly use executable code as the action space or primary
  output artifact. I did not add a mixed category because for these objects one primary
  representation is clearly emphasized in the architecture description, and each object
  can be assigned uniquely.


  D3 Improvement mechanism captures how the system improves outputs across attempts.
  The sources support three distinct mechanisms. ReAct has no explicit across-trial
  self-improvement loop. Reflexion and VOYAGER use reflection/feedback-driven iterative
  improvement, though their feedback forms differ. EUREKA uses evolutionary search
  over sampled code candidates. AutoGen applications also rely on iterative conversational
  correction and feedback, so it fits reflection-based improvement. I did not split
  feedback-driven mechanisms further because that would overfit the small sample and
  create unnecessary complexity not consistently supported across all objects.


  D4 Memory structure captures whether the architecture includes a persistent store
  of distilled prior experience or reusable capabilities. The sources support three
  values. ReAct and EUREKA do not define a persistent memory structure as a core architectural
  element. Reflexion uses reflective episodic memory storing verbal self-reflections.
  VOYAGER uses a skill library of executable code. AutoGen retains conversational
  context but the provided source does not frame a persistent reflective memory or
  reusable skill library as a core built-in architectural component, so it was conservatively
  mapped to no persistent memory. I avoided introducing a generic conversation-history
  memory characteristic because that would be weakly discriminating and overlap with
  ordinary context windows rather than an explicit architecture-level memory design.


  D5 Task generation captures whether tasks come from outside or are autonomously
  generated by the system. Only VOYAGER clearly includes an automatic curriculum that
  proposes self-driven tasks. All others operate on user-specified or benchmark-specified
  tasks. This dimension is strongly grounded and highly discriminating for open-ended
  versus externally directed agents.


  D6 Termination assessment captures how the system determines whether to stop or
  declare success on a task attempt. Two forms were empirically supported. In ReAct,
  Reflexion, AutoGen, and EUREKA, completion is determined by the environment, tests,
  heuristics, or general conversation conditions. VOYAGER uniquely includes an explicit
  agent-based self-verification module using GPT-4 as critic. I did not create a separate
  human-based verification characteristic because none of the chosen primary objects
  require that as the main default architectural mechanism.


  I checked MECE within each dimension. For every dimension, characteristics are mutually
  exclusive for the selected object class and all five objects can be assigned exactly
  one characteristic per dimension. I also verified that every characteristic is used
  by at least one object. No N/A assignments were necessary because each apparent
  gap could be resolved by defining a supported characteristic rather than leaving
  cells empty.


  Object mappings were then assigned conservatively from the source descriptions.
  ReAct is a single-agent text-action architecture with no explicit iterative self-improvement,
  no persistent memory, externally specified tasks, and environment-determined completion.
  Reflexion remains single-agent but adds verbal reflection and reflective memory
  across trials. VOYAGER differs most strongly by code actions, reflective iterative
  prompting, skill library, self-generated curriculum, and self-verification. AutoGen
  is the only clearly multi-agent conversational framework among the selected objects;
  despite supporting tools and code execution, its core architectural interaction
  mode is conversational messaging. EUREKA is a single-agent coding system using executable
  reward code and evolutionary search rather than reflective memory or curriculum
  generation.


  A limitation of this taxonomy is that it is derived from only five sources, so I
  intentionally favored parsimony. Some potentially interesting aspects appeared in
  only one source or lacked enough cross-object variation to justify a standalone
  dimension, such as human-in-the-loop configuration, type of external feedback, embodiedness,
  or grounding source. Another limitation is that AutoGen is a framework supporting
  many possible instantiated systems; I classified the framework by its default architectural
  abstractions described in the paper rather than every possible downstream configuration.
  Similarly, EUREKA is an autonomous agent for reward design rather than a general
  assistant agent, but it still belongs to the same broader class of LLM-based autonomous
  agent systems targeted by the user. Overall, the resulting taxonomy is intentionally
  compact and empirically supported, aimed at helping Information Systems researchers
  and practitioners compare emerging agent architectures at the system level without
  introducing unsupported completeness.'
consolidator_reasoning: 'I treated the supplied taxonomy as the first empirical iteration
  and therefore performed a quality check, normalization, and consistency verification
  rather than a merge. The meta-characteristic filters the taxonomy to architectural
  and behavioral properties of autonomous AI agents, so I retained only dimensions
  that describe system-level design choices relevant to comparing modern predominantly
  LLM-based agents. All six proposed dimensions were relevant to that scope and remain
  below the recommended maximum of nine dimensions.


  I applied minimal normalization to improve methodological consistency. The original
  dimension names were already distinct and relevant, so I preserved them. Several
  characteristic names were phrased as longer descriptions rather than concise noun
  phrases. To satisfy the naming constraint, I shortened them while preserving meaning:
  for example, ''Single-agent architecture'' became ''Single-agent'', ''Text action
  traces'' became ''Text actions'', and ''Environment-determined completion'' became
  ''Environment-determined''. This normalization does not alter the underlying semantics.


  I then checked the dimensions against the MECE requirement. D1 ''Agent organization''
  is mutually exclusive because the classified object is the system architecture as
  a whole, so an object is treated as either primarily single-agent or multi-agent.
  D2 ''Action representation'' is interpreted as the primary action form at the architectural
  level: text actions versus code actions. Some systems can contain both text and
  code artifacts, but the assignments remain mutually exclusive when classified by
  dominant action representation. D3 ''Improvement mechanism'' separates systems with
  no explicit iterative improvement loop, reflection-based improvement, and search-based
  improvement. These categories are mutually exclusive when interpreted by the primary
  mechanism. D4 ''Memory structure'' distinguishes no persistent architectural memory,
  reflective memory, and skill library; these are sufficiently distinct for the present
  object set, and each retained object can be assigned exactly one category. D5 ''Task
  generation'' is binary and exhaustive for the present scope: tasks are either externally
  specified or generated through a self-curriculum. D6 ''Termination assessment''
  distinguishes whether completion is determined externally by environment/task rules
  or internally by a dedicated agent-side verifier. For the retained objects, this
  is both mutually exclusive and exhaustive.


  I validated every object against the topic and meta-characteristic. ReAct, Reflexion,
  Voyager, AutoGen, and EUREKA are all post-2020 systems/frameworks concerned with
  autonomous or semi-autonomous LLM-based agent behavior and architecture, so none
  were removed. AutoGen remains in scope because the user explicitly includes frameworks
  exhibiting autonomous goal-directed behavior, including multi-agent architectures.
  EUREKA is somewhat borderline because it focuses on reward design rather than general
  interactive agency, but it still qualifies as a modern LLM-based autonomous system
  with architectural and behavioral design properties, and the instruction was to
  keep doubtful cases unless clearly out of scope. No duplicate objects were detected.
  I normalized the object name ''VOYAGER'' to ''Voyager'' for consistency.


  I also verified each object-characteristic assignment for plausibility. Most original
  assignments were coherent. I retained the mapping of AutoGen to reflection-based
  improvement because its iterative conversational correction loop functions as a
  reflective improvement process at the system level. I retained Voyager under reflection-based
  rather than search-based improvement because its core mechanism is iterative critique
  and refinement of generated code and goals, not broad search over candidate populations.
  I retained D6 assignments that classify ReAct, Reflexion, AutoGen, and EUREKA as
  environment-determined because they do not rely on a separate verifier module as
  a defining architectural component. No N/A values were present, and no additional
  characteristics were needed to classify the provided objects.


  Finally, I checked internal consistency between taxonomy and mapping. Every referenced
  dimension_id and characteristic_id exists in the final taxonomy. Every retained
  object has exactly one mapping entry for each of the six dimensions. IDs were already
  sequential and consistent, so no renumbering was required beyond keeping the existing
  D1-D6 and O1-O5 structure. The resulting taxonomy is coherent, concise, and suitable
  for Information Systems researchers and practitioners comparing autonomous AI agent
  architectures at the system level.'
