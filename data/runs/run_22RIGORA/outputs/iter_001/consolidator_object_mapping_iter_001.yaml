iteration: 1
objects:
- id: O1
  name: ReAct
  source_document: yao et al 2023 - ReAct- Synergizing Reasoning and Acting in Language
    Models.pdf
  dimension_mappings:
  - dimension_id: D1
    characteristic_id: D1.C1
    reasoning: ReAct is a single LM-based agent that interleaves reasoning and acting
      rather than a coordinated multi-agent system.
  - dimension_id: D2
    characteristic_id: D2.C1
    reasoning: Its actions are primarily expressed as textual reasoning and textual
      environment commands rather than executable program synthesis as the core action
      form.
  - dimension_id: D3
    characteristic_id: D3.C1
    reasoning: It does not include an explicit cross-episode self-improvement loop
      based on reflection or search.
  - dimension_id: D4
    characteristic_id: D4.C1
    reasoning: It relies on current context rather than a persistent reflective memory
      store or reusable skill repository.
  - dimension_id: D5
    characteristic_id: D5.C1
    reasoning: Tasks are provided externally by prompts, benchmarks, or environments.
  - dimension_id: D6
    characteristic_id: D6.C1
    reasoning: Task completion is determined by environment conventions or benchmark
      completion conditions, not a dedicated verifier module.
- id: O2
  name: Reflexion
  source_document: shinn et al 2023 - Reflexion- Language Agents with Verbal Reinforcement
    Learning.pdf
  dimension_mappings:
  - dimension_id: D1
    characteristic_id: D1.C1
    reasoning: Reflexion centers on a single agent policy augmented with evaluation
      and self-reflection components, not multiple autonomous peer agents.
  - dimension_id: D2
    characteristic_id: D2.C1
    reasoning: Its core outputs and feedback are verbal traces and environment-facing
      text actions rather than executable code as the primary action representation.
  - dimension_id: D3
    characteristic_id: D3.C2
    reasoning: Its defining mechanism is verbal self-reflection used to improve subsequent
      trials.
  - dimension_id: D4
    characteristic_id: D4.C2
    reasoning: It stores reflective feedback in memory across episodes for later reuse.
  - dimension_id: D5
    characteristic_id: D5.C1
    reasoning: Tasks are benchmark- or user-specified rather than self-generated by
      the agent.
  - dimension_id: D6
    characteristic_id: D6.C1
    reasoning: Success is judged by environment feedback, heuristics, or tests rather
      than a dedicated verifier agent deciding completion.
- id: O3
  name: VOYAGER
  source_document: wang et al 2023 - Voyager-An Open-Ended Embodied Agent with Large
    Language Models.pdf
  dimension_mappings:
  - dimension_id: D1
    characteristic_id: D1.C1
    reasoning: Voyager is presented as a single embodied agent architecture with internal
      modules rather than multiple autonomous agents.
  - dimension_id: D2
    characteristic_id: D2.C2
    reasoning: Its actions are represented as executable code programs and retrieved
      skills.
  - dimension_id: D3
    characteristic_id: D3.C2
    reasoning: It improves through iterative critique and refinement of generated
      programs rather than population-style search over alternatives.
  - dimension_id: D4
    characteristic_id: D4.C3
    reasoning: A persistent skill library of executable programs is a core architectural
      element.
  - dimension_id: D5
    characteristic_id: D5.C2
    reasoning: It includes an automatic curriculum that proposes new tasks autonomously.
  - dimension_id: D6
    characteristic_id: D6.C2
    reasoning: A self-verification component checks whether generated goals have been
      completed.
- id: O4
  name: AutoGen
  source_document: wu et al 2023- AutoGen-Enabling Next-Gen LLM Applications via Multi-Agent
    Conversation.pdf
  dimension_mappings:
  - dimension_id: D1
    characteristic_id: D1.C2
    reasoning: AutoGen is explicitly designed around multiple conversable agents collaborating
      through message exchange.
  - dimension_id: D2
    characteristic_id: D2.C1
    reasoning: Its primary action medium is conversational text exchange, even if
      code may appear within messages for execution.
  - dimension_id: D3
    characteristic_id: D3.C2
    reasoning: The iterative conversational feedback loop functions as reflection-based
      improvement over prior outputs within the interaction.
  - dimension_id: D4
    characteristic_id: D4.C1
    reasoning: The framework does not define persistent reflective memory or a reusable
      skill library as a core architectural feature.
  - dimension_id: D5
    characteristic_id: D5.C1
    reasoning: Tasks are initiated externally by users or benchmarks rather than generated
      through an internal curriculum.
  - dimension_id: D6
    characteristic_id: D6.C1
    reasoning: Termination is governed by conversation rules or stop conditions rather
      than a dedicated verifier module.
- id: O5
  name: EUREKA
  source_document: ma et al 2023 - Eureka- Human-Level Reward Design via Coding Large
    Language Models.pdf
  dimension_mappings:
  - dimension_id: D1
    characteristic_id: D1.C1
    reasoning: EUREKA is centered on a single coding-agent loop rather than a multi-agent
      architecture.
  - dimension_id: D2
    characteristic_id: D2.C2
    reasoning: Its primary outputs are executable reward-function code candidates.
  - dimension_id: D3
    characteristic_id: D3.C3
    reasoning: Its main improvement mechanism is search over reward candidates guided
      by evaluation statistics.
  - dimension_id: D4
    characteristic_id: D4.C1
    reasoning: It does not rely on a persistent reflective memory buffer or reusable
      skill library as a defining component.
  - dimension_id: D5
    characteristic_id: D5.C1
    reasoning: The task context is supplied externally through environment and reward-design
      specifications.
  - dimension_id: D6
    characteristic_id: D6.C1
    reasoning: Outcome quality is determined by evaluation signals from training and
      environment performance, not a dedicated verifier agent.
