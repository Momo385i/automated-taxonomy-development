  and practitioners evaluating agent designs for specific use cases."

  Primary purpose of the taxonomy: "Structuring an emerging phenomenon. The field
  of autonomous AI agents is rapidly evolving but lacks a unified classification framework
  that goes beyond functional labels."

  Type of objects the user wants to classify: "Individual AI agent systems and frameworks
  that exhibit autonomous, goal-directed behavior — including both single-agent and
  multi-agent architectures. Examples include systems like ReAct, AutoGPT or Voyager."

  Restrictions: "Focus on modern, predominantly LLM-based agents published after 2020.
  Excluded are pure benchmarking frameworks and evaluation tools. The classification
  targets system-level architecture and behavior, not application-domain performance."'
