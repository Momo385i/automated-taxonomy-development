    evidence: 'The change log explicitly reports merging dimensions: ''Merged overlapping
      dimensions'' and absorbed Taxonomy B''s distinctions into other dimensions,
      while dropping standalone dimensions. This means dimensions/characteristics
      were merged/split in the last iteration.'
  - id: OEC_07
