    dimension_mappings:
    - dimension_id: D1
      characteristic_id: D1.C1
      reasoning: EUREKA is described as a single reward-design agentic system rather
        than a multi-agent conversation architecture.
    - dimension_id: D2
      characteristic_id: D2.C2
      reasoning: Its outputs are executable reward function programs produced by a
