    dimension_mappings:
    - dimension_id: D1
      characteristic_id: D1.C2
      reasoning: AutoGen is explicitly a framework of multiple conversable agents
        cooperating through message exchange.
    - dimension_id: D2
      characteristic_id: D2.C3
      reasoning: The framework’s basic operational unit is conversational message
        passing among agents, even when tools or code execution are invoked.
    - dimension_id: D3
      characteristic_id: D3.C5
      reasoning: Task progress is achieved through conversation programming, auto-reply,
