iteration: 2
objects:
- id: O1
  name: ReAct
  source_document: yao et al 2023 - ReAct- Synergizing Reasoning and Acting in Language
    Models.pdf
  dimension_mappings:
  - dimension_id: D1
    characteristic_id: D1.C1
    reasoning: ReAct is presented as a single LM-driven agent rather than a set of
      interacting peer agents.
  - dimension_id: D2
    characteristic_id: D2.C1
    reasoning: Its defining control pattern is an interleaved reasoning-and-acting
      loop rather than task-list management, staged planning, or multi-agent chat.
  - dimension_id: D3
    characteristic_id: D3.C1
    reasoning: The agent emits textual action traces and text-form actions.
  - dimension_id: D4
    characteristic_id: D4.C1
    reasoning: Its main adaptation mechanism is interleaving reasoning traces with
      actions during execution.
  - dimension_id: D5
    characteristic_id: D5.C2
    reasoning: Behavior is adjusted from environment and task interaction outcomes.
  - dimension_id: D6
    characteristic_id: D6.C1
    reasoning: No separate persistent memory architecture is defined beyond current
      context.
  - dimension_id: D7
    characteristic_id: D7.C1
    reasoning: Goals are externally specified by benchmark tasks or prompts.
  - dimension_id: D8
    characteristic_id: D8.C1
    reasoning: The standard execution loop does not require human participation.
- id: O2
  name: Reflexion
  source_document: shinn et al 2023 - Reflexion- Language Agents with Verbal Reinforcement
    Learning.pdf
  dimension_mappings:
  - dimension_id: D1
    characteristic_id: D1.C1
    reasoning: Reflexion is framed as one agent with internal modules, not a multi-agent
      system.
  - dimension_id: D2
    characteristic_id: D2.C1
    reasoning: Its operation remains a single-agent reasoning-and-acting loop across
      repeated attempts.
  - dimension_id: D3
    characteristic_id: D3.C1
    reasoning: Its outputs and corrective traces are primarily textual actions and
      verbal artifacts.
  - dimension_id: D4
    characteristic_id: D4.C2
    reasoning: The defining improvement mechanism is verbal self-reflection stored
      for later trials.
  - dimension_id: D5
    characteristic_id: D5.C4
    reasoning: It can incorporate evaluative or external feedback signals beyond raw
      environment state, making expert-like feedback the best fit among the available
      categories.
  - dimension_id: D6
    characteristic_id: D6.C3
    reasoning: The architecture stores self-reflections in episodic or reflective
      memory for reuse.
  - dimension_id: D7
    characteristic_id: D7.C1
    reasoning: Tasks are benchmark- or user-specified rather than self-generated.
  - dimension_id: D8
    characteristic_id: D8.C1
    reasoning: The core framework is autonomous during task execution.
- id: O3
  name: Voyager
  source_document: wang et al 2023 - Voyager-An Open-Ended Embodied Agent with Large
    Language Models.pdf
  dimension_mappings:
  - dimension_id: D1
    characteristic_id: D1.C1
    reasoning: Voyager is one embodied agent despite multiple internal prompting components.
  - dimension_id: D2
    characteristic_id: D2.C3
    reasoning: It plans tasks and executes generated code, revising based on execution
      outcomes in a plan-execute style loop.
  - dimension_id: D3
    characteristic_id: D3.C2
    reasoning: Its primary action representation is executable code programs.
  - dimension_id: D4
    characteristic_id: D4.C4
    reasoning: The key adaptation mechanism is iterative refinement grounded in execution
      feedback and self-verification.
  - dimension_id: D5
    characteristic_id: D5.C2
    reasoning: The agent learns from environment responses, execution errors, and
      embodied interaction outcomes.
  - dimension_id: D6
    characteristic_id: D6.C7
    reasoning: A reusable skill library of code snippets is a central persistent memory
      structure.
  - dimension_id: D7
    characteristic_id: D7.C2
    reasoning: Voyager includes an automatic curriculum that generates new tasks for
      itself.
  - dimension_id: D8
    characteristic_id: D8.C3
    reasoning: Human feedback can augment the curriculum or critique process, but
      is not always required.
