  dimension_mappings:
  - dimension_id: D1
    characteristic_id: D1.C2
    reasoning: ChatDev is explicitly composed of multiple specialized agents interacting
      through role-based communication.
  - dimension_id: D2
    characteristic_id: D2.C3
    reasoning: Its workflow is organized as a staged chain of chats across software
      development phases.
  - dimension_id: D3
    characteristic_id: D3.C2
    reasoning: The system updates through iterative communication and review during
      execution.
  - dimension_id: D4
    characteristic_id: D4.C3
    reasoning: Its primary runtime feedback is the exchange among collaborating agents.
  - dimension_id: D5
    characteristic_id: D5.C3
    reasoning: The architecture distinguishes phase-level memory and cross-phase retained
      memory.
  - dimension_id: D6
    characteristic_id: D6.C4
    reasoning: It uses clarification-oriented interaction such as communicative dehallucination
      to refine outputs.
  - dimension_id: D7
    characteristic_id: D7.C4
    reasoning: Its operational grounding is through software artifacts and tools used
      for coding, review, and testing.
- id: O5
  name: DEPS
  source_document: Wang 2024 - Describe, Explain, Plan and Select- Interactive Planning
