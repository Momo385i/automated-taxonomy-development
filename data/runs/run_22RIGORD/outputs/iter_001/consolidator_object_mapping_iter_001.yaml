  dimension_mappings:
  - dimension_id: D1
    characteristic_id: D1.C1
    reasoning: DEPS is a single integrated agent architecture with internal modules
      serving one agent.
  - dimension_id: D2
    characteristic_id: D2.C4
    reasoning: It repeatedly plans, executes subgoals, and updates the plan after
      observing outcomes.
  - dimension_id: D3
    characteristic_id: D3.C2
    reasoning: Its architecture is closed-loop because environment feedback drives
      subsequent describe-explain-plan cycles.
  - dimension_id: D4
    characteristic_id: D4.C2
    reasoning: The planner is primarily informed by runtime environment state and
      execution outcomes.
  - dimension_id: D5
    characteristic_id: D5.C5
    reasoning: The paper does not define a distinct standalone memory store type beyond
      state descriptions and plan updates.
  - dimension_id: D6
    characteristic_id: D6.C3
    reasoning: It explicitly replans in response to failures or inefficient paths.
  - dimension_id: D7
    characteristic_id: D7.C3
    reasoning: Its actions are grounded in executing goal-conditioned skills or controllers.
