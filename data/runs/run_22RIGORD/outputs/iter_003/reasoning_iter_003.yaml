empirical_reasoning: 'I followed an empirical-to-conceptual procedure anchored strictly
  in the five provided sources and the stated object class: modern, predominantly
  LLM-based autonomous agent systems/frameworks published after 2020 that exhibit
  autonomous, goal-directed behavior. I first identified concrete objects that are
  clearly instances of this class and are sufficiently distinct at the system level:
  SayCan, ChemCrow, CAMEL role-playing, Generative Agents, and HuggingGPT. I excluded
  subcomponents, baselines, datasets, and evaluation methods because they are not
  themselves autonomous agent architectures of the target class. Each selected object
  is explicitly described in one source document as an autonomous system or framework
  that takes a goal or user request and proceeds with limited or minimal further human
  intervention.


  I then derived differentiating characteristics only where the sources showed meaningful
  variation across objects. I avoided adding dimensions that would be universal, weakly
  supported, or mainly evaluative. For example, all objects are LLM-based, so that
  would not discriminate. Likewise, domains such as robotics, chemistry, social simulation,
  and multimodal AI were present, but domain itself is not the requested focus; instead,
  I extracted architectural properties that explain those systems’ differences.


  Dimension D1, Agent cardinality, emerged directly from the empirical contrast between
  systems centered on one autonomous controller or agent (SayCan, ChemCrow, HuggingGPT)
  and systems whose core architecture depends on multiple interacting agents (CAMEL,
  Generative Agents). This dimension is concise, non-overlapping with others, and
  relevant to both researchers and practitioners comparing agent architectures.


  Dimension D2, External capability integration, captures how the agent extends its
  action capabilities beyond the base LLM. The sources support four distinct forms.
  SayCan grounds planning in pretrained embodied skills; ChemCrow augments reasoning
  with chemistry and general software tools; HuggingGPT routes tasks to external expert
  models from a model hub; CAMEL and Generative Agents, in the described core forms,
  rely on prompt-based or architectural mechanisms without an external tool/model
  set. I kept these characteristics separate because the sources describe them as
  materially different integration patterns: skill repertoires, callable tools, model-hub
  experts, and no such external capability layer.


  Dimension D3, Action-generation mechanism, was derived from the distinct control
  logics used to produce next actions or behaviors. SayCan uses option scoring over
  candidate skills by combining LLM and affordance scores. ChemCrow uses a ReAct-style
  thought-action-observation loop. HuggingGPT uses task decomposition and dependency-aware
  orchestration. CAMEL relies on role-play dialogue between agents. Generative Agents
  produce actions through memory-conditioned planning and reaction. These are all
  directly named or clearly described mechanisms in the sources, and each object fits
  exactly one of them. I did not merge them because doing so would lose explanatory
  value for architecture comparison.


  Dimension D4, Memory architecture, was included because the sources show substantive
  architectural differences in how prior information is stored and reused. Generative
  Agents has the richest explicit memory architecture: memory stream, retrieval, reflection,
  and plans. CAMEL depends on conversation history and system prompts across turns.
  HuggingGPT maintains structured task, dependency, and resource references across
  stages. SayCan and ChemCrow, as described in the selected papers, do not define
  an explicit long-term memory module; they operate iteratively with current instruction/state
  or current reasoning trace, but no dedicated persistent memory architecture is presented
  as a core component. I therefore used “No explicit long-term memory” rather than
  inventing finer distinctions unsupported by the sources. This dimension remains
  non-overlapping with D3: D3 is about how actions are generated, D4 about how prior
  information is represented and carried forward.


  Dimension D5, Physical-world actuation, was supported because the sources clearly
  distinguish systems that remain digital/simulated from those that can trigger real-world
  execution. SayCan actuates a physical robot. ChemCrow can launch syntheses on a
  cloud-connected robotic lab. CAMEL, Generative Agents, and HuggingGPT do not directly
  actuate physical systems in their described implementations. I retained separate
  characteristics for embodied robot actuation and cloud-lab actuation because the
  sources describe these as distinct physical execution settings with different interfaces
  and constraints.


  For object mapping, I assigned each object to exactly one characteristic per dimension,
  ensuring MECE within each dimension. I checked whether any mapping gap required
  adding a new characteristic before considering N/A. No N/A was necessary because
  every object could be assigned cleanly under all five dimensions. I also verified
  that every characteristic is used by at least one object: D1.C1 by SayCan/ChemCrow/HuggingGPT;
  D1.C2 by CAMEL/Generative Agents; D2.C1 by SayCan; D2.C2 by ChemCrow; D2.C3 by HuggingGPT;
  D2.C4 by CAMEL/Generative Agents; D3.C1 by SayCan; D3.C2 by ChemCrow; D3.C3 by HuggingGPT;
  D3.C4 by CAMEL; D3.C5 by Generative Agents; D4.C1 by SayCan/ChemCrow; D4.C2 by CAMEL;
  D4.C3 by HuggingGPT; D4.C4 by Generative Agents; D5.C1 by CAMEL/Generative Agents/HuggingGPT;
  D5.C2 by SayCan; D5.C3 by ChemCrow.


  Analytically, I stayed conservative. I did not introduce dimensions such as autonomy
  level, prompting style, interpretability, safety mechanism, environment type, or
  learning paradigm because the available material either did not support stable MECE
  characteristics across all objects or would have produced overlapping or weakly
  grounded constructs. For instance, prompting styles vary, but they are often tied
  to the action-generation mechanism and not consistently separable across all cases.
  Likewise, safety appears in ChemCrow and as discussion in other papers, but not
  as a common differentiating architectural variable across all objects.


  A limitation of this taxonomy is that it is derived from a small empirical set spanning
  quite different application settings. Accordingly, it is intentionally parsimonious
  and focused on the most robust architectural distinctions that recur across these
  sources. It structures the phenomenon without claiming completeness for the broader
  post-2020 LLM-agent landscape. As more empirical cases are added, future extension
  could elaborate additional dimensions if and only if new sources consistently support
  them without restructuring the present dimensions.'
consolidator_reasoning: 'I first validated Taxonomy A structurally. Taxonomy A is
  relatively coherent and already close to the target topic, but it is incomplete
  as a synthesis candidate because it covers only five dimensions and omits several
  behaviorally relevant aspects captured in Taxonomy B, notably adaptation, feedback,
  task origin, and human involvement. Its names were somewhat verbose, so I minimally
  normalized them to concise noun phrases in the merged result. Taxonomy A also had
  one potential structural weakness: its dimension ''Action-generation mechanism''
  mixed execution styles that are partly control patterns and partly generation bases.
  Taxonomy B had a similar but not identical issue because ''Control pattern'' and
  ''Primary action form'' partly overlap. In synthesis, I resolved this by preserving
  a single dimension ''Control pattern'' and dropping ''Primary action form'' as redundant.
  This improves explanatory power and MECE compliance because action form such as
  text, code, skill, or message often co-occurs with different control logics and
  therefore does not force exactly one characteristic per object without arbitrary
  choices. By contrast, control pattern can be defined around the primary execution
  logic of the architecture.


  I compared both taxonomies side by side. ''Agent cardinality'' was shared and retained
  directly. Taxonomy A''s ''External capability integration'' contributed important
  architectural information absent from B, especially distinctions among no integration,
  software tools, model hubs, and embodied skills. This is highly relevant to AI agent
  architecture, so it was retained in normalized form as ''External integration''.
  Taxonomy A''s ''Physical-world actuation'' was also retained because it materially
  differentiates architectures such as SayCan, ChemCrow, and Inner Monologue from
  purely digital agents. This dimension clearly derives from the meta-characteristic
  and is useful for researchers and practitioners evaluating agent designs. Taxonomy
  B''s ''Adaptation mechanism'', ''Feedback source'', ''Task origin'', and ''Human
  involvement'' each add nonredundant behavioral distinctions and were therefore retained.
  ''Task origin'' is particularly useful for distinguishing agents like Voyager, BabyAGI,
  and Generative Agents from externally tasked systems. ''Human involvement'' remains
  relevant because practitioner evaluation often depends on whether a system is fully
  autonomous, optionally interactive, or explicitly augmented.


  For memory, Taxonomy A and B both had useful but partially overlapping dimensions.
  A distinguished no memory, conversation history, structured dependency memory, and
  reflective memory stream. B distinguished none, context memory, reflective memory,
  task memory, phase memory, retrieval memory, and skill library. I synthesized these
  into one memory dimension with six characteristics: None, Context memory, Task memory,
  Reflective memory, Retrieval memory, and Skill library. ''Phase memory'' from B
  was excluded as a separate characteristic because it is too specific and can be
  subsumed under task memory without loss of classificatory power. ''Structured dependency
  memory'' from A maps naturally into task memory. This preserves MECE better than
  keeping multiple overlapping memory subtypes that are difficult to separate in practice.


  For control logic, I merged A''s ''Action-generation mechanism'' with B''s ''Control
  pattern''. I retained the following characteristics because each captures a meaningfully
  distinct primary architecture style: Option scoring, Reason-act loop, Task cycle,
  Plan-execute, Task graph, Chat chain, and Memory-guided. ''Role-play dialogue''
  from A was merged into ''Chat chain'' because both describe multi-turn conversational
  coordination as the primary execution logic. ''Memory-conditioned generation'' from
  A became ''Memory-guided'', capturing architectures like Generative Agents whose
  generation is driven mainly by memory retrieval and reflection rather than standard
  task decomposition or thought-action sequencing. This merged dimension is more complete
  than either input alone.


  I excluded Taxonomy B''s ''Primary action form'' despite evaluating all its characteristics.
  The exclusion is justified because its categories are not cleanly MECE in this context.
  An architecture may simultaneously use code actions, text actions, and message actions,
  or embodied skill actions plus textual reasoning. Keeping this dimension would either
  force arbitrary primary assignments or require hybrid categories that would inflate
  complexity. The same discriminative information is captured more rigorously by combining
  external integration, control pattern, and physical actuation. Thus the exclusion
  improves coherence and avoids redundancy.


  I retained Taxonomy B''s ''Adaptation mechanism'' and ''Feedback source'' as separate
  dimensions because they explain different aspects. Adaptation mechanism describes
  how the system changes behavior, whereas feedback source describes where the signal
  comes from. For example, Reflexion uses verbal reflection as adaptation but may
  consume external evaluator feedback; AutoGen uses conversational coordination and
  inter-agent feedback; EUREKA uses evolutionary search and environment feedback.
  These are not redundant.


  I validated all objects against the meta-characteristic. All retained objects are
  modern, predominantly LLM-based agent systems or frameworks published after 2020
  and are not mere evaluation tools. I kept doubtful but plausible cases in accordance
  with the instruction to retain doubtful cases. EUREKA is specialized, but it still
  qualifies as an agentic architecture rather than a benchmark. AutoGPT and BabyAGI
  were retained despite weaker source grounding in the provided mapping because the
  objects themselves are unquestionably within scope. ''Auto-GPT with Additional Opinions''
  was assessed for duplication against AutoGPT. I did not merge them because the provided
  description indicates a distinct architectural variant with additional advisory
  feedback and retrieval memory. No other exact duplicates across A and B were present.


  I then rebuilt all object mappings against the final taxonomy. Every object was
  assigned exactly one characteristic per dimension. Where original assignments from
  A or B became incompatible after synthesis, I re-evaluated them using the strongest
  available reasoning. For example, HuggingGPT''s original structured dependency memory
  was mapped to Task memory; SayCan''s robotic skills map to Embodied skills; CAMEL
  and AutoGen were mapped to Chat chain and Conversational coordination; Generative
  Agents was mapped to Memory-guided control and Reflective memory; Voyager was mapped
  to Skill library memory and Self-generated tasks. For objects like SayCan, where
  no explicit adaptation mechanism beyond core action scoring is central, I used the
  residual characteristic ''None'' in the adaptation dimension to maintain collective
  exhaustiveness without N/A. This residual is conceptually justified and avoids inventing
  unsupported adaptation processes.


  The final taxonomy stays within the 9-dimension limit and is internally consistent.
  Each dimension is unique and nonredundant. Within each dimension, the characteristics
  are intended to be mutually exclusive by classifying only the primary architectural
  attribute. They are collectively exhaustive for the retained object set, with residual
  categories such as ''None'' where necessary. All final mapping references correspond
  to existing dimension and characteristic IDs, and every retained object has exactly
  one mapping for each dimension. The result synthesizes the best explanatory elements
  from both inputs while removing overlaps that would reduce clarity for Information
  Systems researchers and practitioners comparing autonomous AI agent architectures.'
