    recommendation: Met. Eight dimensions is manageable for IS researchers and practitioners,
      and the dimensions are organized around clear architectural and behavioral aspects
      rather than an unwieldy feature list.
  - id: SEC_02
    name: Robust
    met: true
    recommendation: Met. The taxonomy differentiates important families such as single
      vs multi-agent systems, memory-centric vs stateless systems, and reactive vs
      hierarchical/conversational planning. The sample objects can be meaningfully
      compared using these dimensions.
  - id: SEC_03
