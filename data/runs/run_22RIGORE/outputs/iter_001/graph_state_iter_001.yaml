  - id: OEC_08
    name: Unique characteristics
    met: true
    evidence: Within each dimension, characteristic names are unique. For example,
      D3 contains None, Interleaved reasoning, Verbal reflection, Code refinement,
      and Evolutionary search with no duplicates within D3; the same holds for D1,
