empirical_reasoning: 'I followed an empirical-to-conceptual procedure grounded strictly
  in the five provided sources and constrained the taxonomy to aspects that clearly
  differentiate the same object class: modern LLM-based autonomous agent systems or
  agent frameworks with goal-directed behavior. I first identified concrete objects
  at the system/framework level, not baselines, benchmarks, or application instances.
  The resulting coherent object class is: ReAct, Reflexion, Voyager, AutoGen, and
  EUREKA. Each is a named agent architecture or framework from a distinct source document
  and fits the topic because each describes an autonomous or semi-autonomous LLM-centered
  agentic system design.


  Object identification process: ReAct is a prompt-based single-agent framework combining
  reasoning and acting. Reflexion is a language-agent framework that improves through
  verbal reinforcement and episodic memory. Voyager is an embodied lifelong-learning
  agent for Minecraft. AutoGen is a multi-agent conversation framework with conversable
  agents. EUREKA is an LLM-based autonomous reward-design agent that iteratively generates
  and improves executable reward code. Although EUREKA is focused on reward design
  rather than conventional environment acting, the source explicitly frames it as
  a programmatic agent using autonomous iterative search, so it remains inside the
  requested object class of autonomous AI agent systems/frameworks.


  I then extracted differentiating characteristics that were explicitly supported
  across the sources. I excluded properties that were either too universal among the
  objects or insufficiently evidenced in the supplied material. For example, all objects
  are LLM-based and all avoid gradient-based fine-tuning during core operation, so
  those properties do not discriminate well and were not included. I also avoided
  adding dimensions for safety, embodiment, or tool use because, although present
  in some sources, the empirical support across the selected objects did not form
  a parsimonious MECE set without forcing asymmetries or one-off categories.


  Dimension formation:


  D1 Agent cardinality was derived because the sources clearly distinguish systems
  centered on one agent architecture (ReAct, Reflexion, Voyager, EUREKA) from a framework
  built around multiple interacting agents (AutoGen). This dimension is non-overlapping
  with the others because it captures architectural multiplicity rather than action
  form, learning loop, memory, or task source.


  D2 Primary action representation emerged from how systems operationalize action.
  ReAct and Reflexion primarily emit natural-language actions or text actions into
  environments. Voyager and EUREKA explicitly use executable code as the operative
  output. AutoGen’s distinctive architectural mechanism is message passing among conversable
  agents, so message-based coordination is empirically justified as a separate characteristic
  rather than forcing it under natural language or code. I kept this dimension at
  the level of the primary operative representation to preserve mutual exclusivity.


  D3 Improvement mechanism captures the main architectural means by which the system
  improves outputs or behavior over time. ReAct improves task solving through interleaved
  reasoning during a trajectory. Reflexion improves through verbal reflection across
  trials. Voyager improves code via iterative refinement using environment feedback,
  execution errors, and self-verification. EUREKA improves via evolutionary search
  over generated reward code. AutoGen, as presented in the source, is mainly a coordination
  framework; while specific applications may include repair loops, the framework-level
  contribution is not one singular built-in improvement paradigm comparable to the
  others, so "None" is empirically the most conservative characteristic here. This
  was preferable to inventing a broad catch-all label that would blur meaningful differences.


  D4 Persistent memory structure was supported by clear differences in whether and
  how systems preserve reusable information across steps or trials. ReAct has no explicit
  persistent store beyond current context. Reflexion stores self-reflections in episodic
  memory. Voyager stores executable skills in a skill library. AutoGen agents maintain
  message histories and internal conversational context; this is a framework-supported
  persistent context structure distinct from reflection memory or skill libraries.
  EUREKA does not describe a persistent reusable memory store of the same kind, so
  it is assigned "None." This dimension is distinct from D3 because one can have an
  improvement mechanism without a durable memory artifact, or a memory structure without
  a particular optimization loop.


  D5 Task sourcing captures whether goals are externally specified or autonomously
  generated. Voyager alone clearly uses an automatic curriculum to self-propose tasks.
  ReAct, Reflexion, AutoGen applications, and EUREKA all operate on tasks, prompts,
  or objectives given from outside. This dimension directly supports the user purpose
  of differentiating autonomous agent behavior beyond simple functional labels.


  MECE verification:

  - Within each dimension, characteristics are mutually exclusive at the level defined.

  - Each object is assignable to exactly one characteristic per dimension.

  - Characteristics are collectively exhaustive for the selected objects.

  - Every characteristic is used by at least one object.

  - No N/A assignments were necessary because the supported characteristic sets fully
  covered the empirical objects.


  Mapping rationale summary:

  - ReAct: single agent; natural-language actions; interleaved reasoning; no persistent
  cross-trial memory; externally specified tasks.

  - Reflexion: single agent; natural-language actions; verbal reflection; reflection
  memory; externally specified tasks.

  - Voyager: single agent; executable-code actions; iterative code refinement; skill
  library; self-generated curriculum.

  - AutoGen: multi-agent architecture; message-based coordination; no single framework-level
  improvement mechanism; conversation history; externally specified tasks.

  - EUREKA: single agent; executable-code actions; evolutionary search; no persistent
  reusable memory structure; externally specified tasks.


  Analytical conservatism and limitations:

  This taxonomy is intentionally parsimonious. I did not introduce additional dimensions
  such as embodiment, evaluator type, feedback source, human involvement, environment
  coupling, or tool execution because doing so would either rely on sparse evidence,
  create categories used by only one object without broader explanatory value, or
  overlap with included dimensions. Another limitation is that AutoGen is a framework
  for building many kinds of agents rather than one fixed agent architecture, so its
  coding in some dimensions necessarily reflects the framework’s default and most
  central architectural contribution rather than every possible instantiated application.
  Similarly, EUREKA sits at the boundary between "agent" and "agentic optimization
  framework," but it still fits the empirical object class defined by the sources
  because it autonomously generates, evaluates, and improves code toward goals.


  Overall, the resulting taxonomy is empirically grounded, minimal, and suitable for
  Information Systems researchers and practitioners who need to compare modern LLM-based
  agent architectures in terms of architectural structure, action form, improvement
  loop, memory, and degree of task autonomy.'
consolidator_reasoning: 'I treated the provided taxonomy as a first-iteration empirical
  taxonomy and performed a methodological quality check against the stated meta-characteristic:
  architectural and behavioral properties of autonomous AI agents. The objects were
  first validated for scope. All five objects are modern, predominantly LLM-based
  agent systems or frameworks published after 2020, and none are pure evaluation or
  benchmarking tools. ReAct, Reflexion, Voyager, and AutoGen are clearly central examples
  of the target conceptual class. EUREKA is somewhat narrower because it focuses on
  autonomous reward design, but it still constitutes an agentic system with autonomous
  goal-directed optimization behavior at the architectural level, so it should be
  retained rather than removed. No duplicate objects were detected.


  I then validated the taxonomy structure. The original dimensions were relevant to
  the meta-characteristic and collectively focused on architectural and behavioral
  properties rather than unrelated contextual variables. The taxonomy remained within
  the recommended size limit, with five dimensions. I applied only minimal normalization:
  several dimension and characteristic names were shortened to concise noun phrases
  of one to three words, while preserving meaning. For example, ''Primary action representation''
  became ''Action representation'', and several characteristics such as ''Single-agent
  architecture'' became ''Single-agent''. This improves consistency with the naming
  constraint without changing content.


  Next, I checked each dimension for mutual exclusivity and collective exhaustiveness
  in the context of the retained objects. D1 Agent cardinality is mutually exclusive
  if interpreted at the system architecture level, which is consistent with the meta-characteristic;
  each object is either primarily single-agent or multi-agent. D2 Action representation
  is also workable as long as it captures the primary action medium rather than every
  possible output type. This is important because some systems can both converse and
  emit code, but the taxonomy is intended to classify the primary architectural action
  representation. Under that interpretation, the three characteristics are mutually
  exclusive for the retained cases. D3 Improvement mechanism required a careful reading
  because some objects use more than one adaptive process. To preserve MECE, I interpreted
  the dimension as the dominant built-in improvement mechanism at the system level.
  Under that definition, ''Interleaved reasoning'', ''Verbal reflection'', ''Code
  refinement'', and ''Evolutionary search'' are distinct, while ''None'' serves as
  a residual category for systems without a defining built-in improvement loop. This
  avoids N/A and preserves exclusiveness. D4 Memory structure is mutually exclusive
  if interpreted as the primary persistent memory form explicitly emphasized by the
  architecture. The current characteristics cover the retained objects without gaps.
  D5 Task sourcing is fully exhaustive for the current scope with the binary distinction
  between externally provided tasks and self-generated curriculum.


  I then verified object-characteristic mappings one by one. ReAct plausibly maps
  to single-agent, natural language, interleaved reasoning, no persistent memory,
  and external tasking. Reflexion plausibly maps to single-agent, natural language,
  verbal reflection, reflection memory, and external tasking. Voyager plausibly maps
  to single-agent, executable code, code refinement, skill library, and self curriculum.
  AutoGen plausibly maps to multi-agent, message coordination, no built-in improvement
  mechanism at framework level, conversation history, and external tasking. EUREKA
  plausibly maps to single-agent, executable code, evolutionary search, no persistent
  memory, and external tasking. None of the mappings required correction. Importantly,
  every retained object maps to exactly one characteristic per dimension, and all
  referenced dimension and characteristic IDs exist in the final taxonomy.


  Finally, I checked internal consistency between taxonomy and mapping. The final
  taxonomy uses sequential IDs with no gaps, all names are concise noun phrases, and
  the object mapping is complete and aligned with the taxonomy. Because no structural
  gaps were found and no object fell clearly outside the conceptual class, the final
  result is primarily a cleaned and validated version of Taxonomy A rather than a
  restructured taxonomy. This is appropriate for a first iteration because the empirical
  structure is already coherent, parsimonious, and useful for comparing modern AI
  agent architectures at the system level.'
