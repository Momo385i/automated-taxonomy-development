objective_ending_conditions:
- id: OEC_01
  name: Mutual Exclusivity
  description: In each dimension, no object can have two different characteristics.
    If an object can logically be assigned to more than one characteristic, the dimension
    is not mutually exclusive and should be restructured.
- id: OEC_02
  name: Collective Exhaustiveness
  description: Each object must have at least one of the characteristics in any dimension.
    If a valid object exists that cannot be classified into any existing category,
    the dimension is not collectively exhaustive and requires an additional or a residual
    characteristic.
- id: OEC_03
  name: No object merge/split
  description: No object was merged with a similar object or split into multiple objects
    in the last iteration. If objects were merged or split, then we need to examine
    the impact of these changes and determine if changes need to be made in the dimensions
    or characteristics.
- id: OEC_04
  name: No 'null' characteristics
  description: At least one object is classified under every characteristic of every
    dimension. If at least one object is not found under a characteristic, then the
    taxonomy has a 'null' characteristic. We must either identify an object with the
    characteristic or remove the characteristic from the taxonomy.
- id: OEC_05
  name: No new dimensions/characteristics
  description: No new dimensions or characteristics were added in the last iteration.
    If new dimensions were found, then more characteristics of the dimensions may
    be identified. If new characteristics were found, then more dimensions may be
    identified that include these characteristics.
- id: OEC_06
  name: No dimension/characteristic merge/split
  description: No dimensions or characteristics were merged or split in the last iteration.
    If dimensions or characteristics were merged or split, then we need to examine
    the impact of these changes and determine if other dimensions or characteristics
    need to be merged or split.
- id: OEC_07
  name: Unique dimensions
  description: Every dimension is unique and not repeated (i.e., there is no dimension
    duplication). If dimensions are not unique, then there is redundancy/duplication
    among dimensions that needs to be eliminated.
- id: OEC_08
  name: Unique characteristics
  description: Every characteristic is unique within its dimension (i.e., there is
    no characteristic duplication within a dimension). If characteristics within a
    dimension are not unique, then there is redundancy/duplication in characteristics
    that needs to be eliminated.
- id: OEC_09
  name: Unique cells
  description: Each cell (combination of characteristics) is unique and is not repeated
    (i.e., there is no cell duplication). If cells are not unique, then there is redundancy/duplication
    in cells that needs to be eliminated.
