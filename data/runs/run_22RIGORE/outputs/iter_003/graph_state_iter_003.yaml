      differences rather than merely labeling systems by application domain.
  - id: SEC_06
    name: Representative sample
    met: true
    recommendation: Met. The 16-object sample spans single-agent and multi-agent systems,
      digital and physical settings, embodied and software agents, memory-centric
      systems, reflective agents, curriculum-based agents, and coding/robotic examples.
      Although still skewed toward digital LLM agents, that bias is broadly aligned
