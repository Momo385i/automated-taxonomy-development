  - dimension_id: D5
    characteristic_id: D5.C2
    reasoning: The sensor is designed for continual transmission and the system checks
      values every 5 minutes.
  - dimension_id: D6
    characteristic_id: D6.C2
    reasoning: Threshold logic in the web application raises alerts and emails caregivers.
  - dimension_id: D7
    characteristic_id: D7.C3
    reasoning: Data move from sensor to server/database to web dashboard, with platform
      mediation.
  - dimension_id: D8
    characteristic_id: D8.C3
    reasoning: No formal interoperability standard is described.
