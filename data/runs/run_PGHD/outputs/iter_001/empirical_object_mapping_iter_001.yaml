- id: O7
  name: HL7 CDA middleware information model for PGHD and ODL exchange
  source_document: Plastiras and O'Sullivan 2018
  dimension_mappings:
  - dimension_id: D1
    characteristic_id: D1.C3
    reasoning: The model supports exchange of data generated in personal settings
      into provider EHRs across contexts rather than one single care setting.
  - dimension_id: D2
    characteristic_id: D2.C1
    reasoning: The purpose is explicit exchange of PGHD and ODL data with EHR systems.
  - dimension_id: D3
    characteristic_id: D3.C3
    reasoning: The examples include both device-generated data and user-entered app
      data.
  - dimension_id: D4
    characteristic_id: D4.C3
    reasoning: The model covers sleep, nutrition, reproductive health, and goals across
      multiple app sources.
  - dimension_id: D5
    characteristic_id: D5.C1
    reasoning: The demonstrated exchange uses exported app data transformed for transfer,
      not continuous streaming.
  - dimension_id: D6
    characteristic_id: D6.C1
    reasoning: The model focuses on standardized exchange and representation, not
      operational alerting or decision support.
  - dimension_id: D7
    characteristic_id: D7.C2
    reasoning: A middleware information model and mapping rules transform app data
      into exchange documents.
  - dimension_id: D8
    characteristic_id: D8.C2
    reasoning: The information model and evaluation are explicitly based on HL7 CDA.
