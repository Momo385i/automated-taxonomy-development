    reasoning: It combines EMA self-reports with sensor-based measurements.
  - dimension_id: D4
    characteristic_id: D4.C3
    reasoning: The platform integrates physiologic, environmental, behavioral, geospatial,
      and EHR-linked information.
  - dimension_id: D5
    characteristic_id: D5.C3
    reasoning: Sensor streams are continuous while EMAs are scheduled, random, or
      triggered.
  - dimension_id: D6
    characteristic_id: D6.C3
    reasoning: Sensor-informed triggers and server-side analysis generate context-sensitive
      EMA actions and monitoring support.
  - dimension_id: D7
    characteristic_id: D7.C3
    reasoning: A smartwatch/smartphone hub transmits to cloud servers and dashboards,
      mediating the exchange with EHR data.
  - dimension_id: D8
