objects:
- id: O1
  name: COVID-19 home quarantine clinical decision support system
  source_document: Alcoceba-Herrero et al. 2023
  dimension_mappings:
  - dimension_id: D1
    characteristic_id: D1.C1
    reasoning: The system monitors patients in home quarantine after diagnosis.
  - dimension_id: D2
    characteristic_id: D2.C3
    reasoning: Data are sent to an online platform used by primary care and emergency
      professionals rather than described as written into an EHR/HIS.
  - dimension_id: D3
    characteristic_id: D3.C3
    reasoning: Patients report symptoms in the app and wearable devices contribute
      vital-sign data.
  - dimension_id: D4
    characteristic_id: D4.C3
    reasoning: The system combines symptoms and multiple vital signs from devices.
  - dimension_id: D5
    characteristic_id: D5.C3
    reasoning: Symptoms and some oximetry values are reported three times daily while
      smartwatch data are monitored in real time.
  - dimension_id: D6
    characteristic_id: D6.C3
    reasoning: AI processing generates moderate or severe alerts that support clinician
      action.
  - dimension_id: D7
    characteristic_id: D7.C3
    reasoning: Data flow through the app to a server and online platform used by clinicians.
  - dimension_id: D8
    characteristic_id: D8.C3
    reasoning: No FHIR or CDA standard is specified; integration is described as platform/server
      based.
- id: O2
