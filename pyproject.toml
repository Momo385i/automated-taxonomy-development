[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mas-taxonomy"
version = "0.1.0"
description = "-- description --"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langchain-core>=1.2.1",
    "langchain-openai>=1.1.3",
    "langchain-anthropic>=1.4.0",
    "langchain-google-genai>=4.2.1",
    "langgraph>=1.0.5",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "pymupdf>=1.27.0",
    "pymupdf4llm>=1.27.0",
    "pypdf>=6.4.2",
    "python-dotenv>=1.2.1",
    "pyyaml>=6.0.3",
    "rich>=14.2.0",
    "typer>=0.20.0",
    "matplotlib>=3.10.8",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
